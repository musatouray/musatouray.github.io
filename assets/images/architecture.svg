<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive">
  <!-- white background (unfiltered, so the outer edge stays straight) -->
  <rect x="0" y="0" width="1120" height="820" fill="#ffffff"/>

  <defs>
    <!-- hand-drawn "roughen" filter: displaces straight edges into gentle wobbles -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="ah" markerWidth="14" markerHeight="14" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== shapes + arrows (roughened) ===== -->
  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2.2" stroke-linejoin="round">
    <!-- A: SQL Server -->
    <rect x="40" y="300" width="190" height="150" rx="8" fill="#a5d8ff"/>
    <!-- B: gateway -->
    <rect x="280" y="320" width="120" height="110" rx="8" fill="#e9ecef"/>
    <!-- C: Data Factory pipeline container -->
    <rect x="450" y="150" width="380" height="440" rx="10" fill="#fff9db"/>
    <!-- D: Bronze -->
    <rect x="890" y="300" width="200" height="150" rx="8" fill="#b2f2bb"/>
    <!-- E: warehouse / watermark -->
    <rect x="500" y="640" width="300" height="120" rx="8" fill="#d0bfff"/>

    <!-- arrows -->
    <path d="M230,375 Q255,371 278,375" fill="none" marker-end="url(#ah)"/>
    <path d="M400,375 Q425,379 448,375" fill="none" marker-end="url(#ah)"/>
    <path d="M830,375 Q860,370 888,375" fill="none" marker-end="url(#ah)"/>
    <!-- write new watermark (down) -->
    <path d="M612,590 Q607,616 616,638" fill="none" marker-end="url(#ah)"/>
    <!-- read old watermark (up) -->
    <path d="M700,638 Q705,612 694,592" fill="none" marker-end="url(#ah)"/>
  </g>

  <!-- ===== text (crisp) ===== -->
  <g fill="#1e1e1e">
    <!-- title -->
    <text x="470" y="58" font-size="33" text-anchor="middle" font-weight="bold">On-prem SQL &#8594; Fabric Bronze</text>
    <text x="470" y="88" font-size="17" text-anchor="middle" fill="#495057">incremental migration &#183; medallion &#183; Phase B</text>

    <!-- A -->
    <text x="135" y="352" font-size="19" text-anchor="middle" font-weight="bold">SQL Server</text>
    <text x="135" y="378" font-size="16" text-anchor="middle">MetalsDW</text>
    <text x="135" y="402" font-size="13" text-anchor="middle" fill="#495057">legacy DW &#183; 14M+ rows</text>

    <!-- B -->
    <text x="340" y="368" font-size="16" text-anchor="middle">on-prem</text>
    <text x="340" y="392" font-size="16" text-anchor="middle">data gateway</text>

    <!-- C title -->
    <text x="640" y="192" font-size="20" text-anchor="middle" font-weight="bold">Fabric Data Factory</text>
    <text x="640" y="216" font-size="15" text-anchor="middle" fill="#495057">pl_migrate_onprem</text>
    <!-- C notes -->
    <g font-size="16">
      <text x="478" y="262">&#10003; watermark &#8594; incremental</text>
      <text x="478" y="298">&#10003; dynamic range &#8594; parallel read</text>
      <text x="500" y="320" font-size="13" fill="#495057">(10M-row FactTrade)</text>
      <text x="478" y="356">&#10003; reusable child pipeline / fact</text>
      <text x="478" y="392">&#10003; delete-range &#8594; idempotent</text>
      <text x="478" y="428">&#10003; dimensions: full reload</text>
      <text x="478" y="464">&#10003; decoupled fact branches</text>
    </g>

    <!-- D -->
    <text x="990" y="350" font-size="20" text-anchor="middle" font-weight="bold">Bronze</text>
    <text x="990" y="376" font-size="14" text-anchor="middle">lh_metals &#183; raw Delta</text>
    <text x="990" y="400" font-size="14" text-anchor="middle" fill="#495057">9 dims + 6 facts</text>

    <!-- E -->
    <text x="650" y="686" font-size="18" text-anchor="middle" font-weight="bold">wh_metals</text>
    <text x="650" y="710" font-size="15" text-anchor="middle">ctl.LoadWatermark</text>
    <text x="650" y="732" font-size="13" text-anchor="middle" fill="#495057">watermark state</text>

    <!-- arrow labels -->
    <text x="859" y="360" font-size="13" text-anchor="middle" fill="#495057">append</text>
    <text x="556" y="620" font-size="12.5" text-anchor="end" fill="#495057">write new</text>
    <text x="742" y="620" font-size="12.5" text-anchor="start" fill="#495057">read old</text>
  </g>
</svg>

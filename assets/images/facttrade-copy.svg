<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive">
  <rect x="0" y="0" width="1260" height="560" fill="#ffffff"/>
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="ah" markerWidth="14" markerHeight="14" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2.2" stroke-linejoin="round">
    <rect x="30"  y="235" width="210" height="150" rx="8" fill="#d0bfff"/>
    <rect x="285" y="235" width="210" height="150" rx="8" fill="#e9ecef"/>
    <rect x="540" y="235" width="210" height="150" rx="8" fill="#ffc9c9"/>
    <rect x="795" y="235" width="210" height="150" rx="8" fill="#b2f2bb"/>
    <rect x="1050" y="235" width="180" height="150" rx="8" fill="#d0bfff"/>
    <!-- arrows between the 5 steps -->
    <path d="M240,310 Q262,306 283,310" fill="none" marker-end="url(#ah)"/>
    <path d="M495,310 Q517,314 538,310" fill="none" marker-end="url(#ah)"/>
    <path d="M750,310 Q772,306 793,310" fill="none" marker-end="url(#ah)"/>
    <path d="M1005,310 Q1027,314 1048,310" fill="none" marker-end="url(#ah)"/>
  </g>

  <g fill="#1e1e1e">
    <text x="30" y="52" font-size="30" font-weight="bold">FactTrade — incremental, partitioned, retry-safe</text>

    <!-- 1 lookup old -->
    <text x="135" y="288" font-size="15.5" text-anchor="middle" font-weight="bold">Lookup: old</text>
    <text x="135" y="311" font-size="14" text-anchor="middle">watermark</text>
    <text x="135" y="336" font-size="12.5" text-anchor="middle" fill="#495057">ctl.LoadWatermark</text>
    <text x="135" y="356" font-size="12.5" text-anchor="middle" fill="#495057">(wh_metals)</text>

    <!-- 2 lookup new -->
    <text x="390" y="288" font-size="15.5" text-anchor="middle" font-weight="bold">Lookup: new</text>
    <text x="390" y="311" font-size="14" text-anchor="middle">MAX(TradeKey)</text>
    <text x="390" y="336" font-size="12.5" text-anchor="middle" fill="#495057">on-prem source</text>
    <text x="390" y="356" font-size="12.5" text-anchor="middle" fill="#495057">(via gateway)</text>

    <!-- 3 delete range -->
    <text x="645" y="285" font-size="15.5" text-anchor="middle" font-weight="bold">Notebook:</text>
    <text x="645" y="307" font-size="15.5" text-anchor="middle" font-weight="bold">delete range</text>
    <text x="645" y="332" font-size="12.5" text-anchor="middle" fill="#495057">bronze.FactTrade</text>
    <text x="645" y="352" font-size="12.5" text-anchor="middle" fill="#495057">(old, new]</text>

    <!-- 4 copy append -->
    <text x="900" y="285" font-size="15.5" text-anchor="middle" font-weight="bold">Copy &#8594; append</text>
    <text x="900" y="309" font-size="13.5" text-anchor="middle">DynamicRange &#215; 8</text>
    <text x="900" y="334" font-size="12.5" text-anchor="middle" fill="#495057">bronze.FactTrade</text>
    <text x="900" y="354" font-size="12.5" text-anchor="middle" fill="#495057">+ metadata cols</text>

    <!-- 5 update -->
    <text x="1140" y="288" font-size="15.5" text-anchor="middle" font-weight="bold">Script:</text>
    <text x="1140" y="311" font-size="15.5" text-anchor="middle" font-weight="bold">update mark</text>
    <text x="1140" y="336" font-size="12.5" text-anchor="middle" fill="#495057">ctl.LoadWatermark</text>
    <text x="1140" y="356" font-size="12.5" text-anchor="middle" fill="#495057">(on success)</text>

    <!-- annotations -->
    <text x="262" y="430" font-size="13.5" text-anchor="middle" fill="#495057">bounds the delta</text>
    <text x="645" y="430" font-size="13.5" text-anchor="middle" fill="#c92a2a">makes retries idempotent</text>
    <text x="900" y="430" font-size="13.5" text-anchor="middle" fill="#2b8a3e">parallel read, append only</text>
    <text x="1140" y="430" font-size="13.5" text-anchor="middle" fill="#495057">advance watermark</text>
  </g>
</svg>
